// Raymarched Plume Trails - per-engine plume configuration.
//
// Every engine is classified automatically from its propellants:
//   solid        SolidFuel / solid motors            sooty white SRB smoke
//   kerolox      LiquidFuel + Oxidizer               white water vapour + a little soot
//   methalox     LqdMethane (+ Oxidizer)             cleaner, thinner vapour
//   hydrolox     LqdHydrogen + Oxidizer              almost pure water vapour, very thin
//   hypergolic   MonoPropellant engines
//   nuclear      hydrogen / LiquidFuel alone (NERV)  pure H2: no plume by default
//   none         jets (IntakeAir), ion/xenon         no plume
//
// To override a part, add a node like the ones below (any .cfg file works, ModuleManager is not needed).
//   part         part name (the `name =` of the part config); repeat the line for several parts
//   plume        solid | kerolox | hydrolox | methalox | hypergolic | nuclear | none
//   sizeScale    x plume size            (liquid engines, on top of the "Liquid plume size" slider)
//   densityScale x plume density         (liquid engines, on top of the "Liquid plume density" slider)
//   visibility   extra x on the kind's visibility
//   waterFrac    H2O mass fraction of the exhaust, used by the condensation model (0..1)
// Physical plumes (Effects -> Physical plumes). Normally the nozzle comes from the engine's own Isp curve (vacuum vs sea level);
// these override it:
//   chamberPressure  MPa
//   expansionRatio   nozzle exit area / throat area
//   exitDiameter     m
//   nozzle           bell | conical | aerospike   (aerospike is also recognised from the part name)
//   exitAngle        nozzle exit half-angle, degrees (default: bell 10, conical 15, aerospike 0)

RPT_ENGINE
{
	part = restock-engine-torch
	plume = kerolox
	sizeScale = 1.2
	densityScale = 1.3
}

RPT_ENGINE
{
	// small hypergolic upper-stage / lander engines: thin, short
	part = benjee10_AJ10_v2
	plume = hypergolic
	sizeScale = 0.8
	densityScale = 0.8
}

RPT_ENGINE
{
	// vernier engines: tiny
	part = LiquidEngineRV-1
	sizeScale = 0.5
	densityScale = 0.6
}

RPT_ENGINE
{
	// a nuclear engine that should still show a faint plume
	part = restock-engine-cherenkov
	plume = nuclear
	sizeScale = 0.8
	densityScale = 0.3
}
