// Hand Avalanche's solid-motor smoke trail over to Raymarched Plume Trails.
//
// Avalanche gives a solid motor three things: a Waterfall flame at the nozzle, a
// SmokeScreen particle trail, and a flameout fireball. We replace only the middle one.
// The flame and the burnout effects are near-field fire, which a raymarched volume does
// not do, so Avalanche keeps them; the trail is ours. Running both would put two
// different kinds of smoke on top of each other where they meet.
//
// SURGICAL on purpose. The SolidSmoke effect is also the engine's powerEffectName, and
// it carries four AUDIO nodes - the SRB burn loop, ignition, vent and explosion. Deleting
// the whole effect would have silenced every solid motor in the game. Only the particle
// emitter goes; the sound stays exactly as Avalanche made it.
//
// FINAL so it runs after Avalanche has expanded its AvPLUME templates into EFFECTS.
// Applied at load: if the smoke is switched off in-game, solid motors are left with no
// trail at all until the game is restarted without this file.

@PART[*]:HAS[@EFFECTS:HAS[@SolidSmoke:HAS[@MODEL_MULTI_SHURIKEN_PERSIST]]]:NEEDS[SmokeScreen,Avalanche]:FINAL
{
    @EFFECTS
    {
        @SolidSmoke
        {
            !MODEL_MULTI_SHURIKEN_PERSIST,* {}
        }
    }
}
